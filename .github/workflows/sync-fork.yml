name: Sync fork with upstream

on:
  schedule:
    - cron: "23 5 * * *" # daily, off the hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward default branch from upstream
        env:
          # GITHUB_TOKEN can't merge changes that touch .github/workflows/*
          # (GitHub blocks this regardless of the permissions block above),
          # which breaks the sync whenever upstream updates its own CI. A
          # token with the `workflow` scope is required instead.
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: gh repo sync ${{ github.repository }}
